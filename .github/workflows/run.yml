name: Post to BotBlock

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up environment
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        require-lockfile: true
        cache: true

    - name: Set up build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-build
      with:
        path: build
        key: build-${{ github.sha }}

    - name: Build project
      run: pnpm build
      if: steps.cache-build.outputs.cache-hit != 'true'

    - name: Post to Botblock
      run: pnpm start
      env:
        DISCORD_BOT_ID: "467377486141980682"
        COUNTR_API_ENDPOINT: ${{ secrets.COUNTR_API_ENDPOINT }}
        BOTBLOCK_KEYS: ${{ secrets.BOTBLOCK_KEYS }}
        TOPGG_API_KEY: ${{ secrets.TOPGG_API_KEY }}
